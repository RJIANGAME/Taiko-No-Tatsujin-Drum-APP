name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build APK
        run: ./gradlew :app:assembleDebug
      - name: Pack Windows release ZIP
        shell: pwsh
        run: |
          $package = "dist/Taiko-Phone-Drum-Windows"
          New-Item -ItemType Directory -Force -Path "$package/scripts", "$package/receiver" | Out-Null
          Copy-Item "Taiko-Drum-Menu.bat" "$package/"
          Copy-Item "release/README.txt" "$package/"
          Copy-Item "scripts/run-receiver.ps1" "$package/scripts/"
          Copy-Item "scripts/usb-adb-reverse.ps1" "$package/scripts/"
          Copy-Item "scripts/install-apk.ps1" "$package/scripts/"
          Copy-Item "receiver/TaikoDrumReceiver.ps1" "$package/receiver/"
          Copy-Item "app/build/outputs/apk/debug/app-debug.apk" "$package/Taiko-Phone-Drum-debug.apk"
          Compress-Archive -Path "$package/*" -DestinationPath "dist/Taiko-Phone-Drum-Windows.zip" -Force
          Copy-Item "app/build/outputs/apk/debug/app-debug.apk" "dist/Taiko-Phone-Drum-debug.apk"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Taiko-Phone-Drum-Windows.zip" \
            "dist/Taiko-Phone-Drum-debug.apk" \
            --title "Taiko Phone Drum $GITHUB_REF_NAME" \
            --notes "Download Taiko-Phone-Drum-Windows.zip for the Windows receiver/menu package and Taiko-Phone-Drum-debug.apk for Android. The ZIP includes the BAT plus all scripts it needs."
