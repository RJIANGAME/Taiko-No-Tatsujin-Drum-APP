name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build APK
        run: ./gradlew :app:assembleDebug
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Taiko-Drum-Menu.bat" \
            "app/build/outputs/apk/debug/app-debug.apk#Taiko-Phone-Drum-debug.apk" \
            --title "Taiko Phone Drum $GITHUB_REF_NAME" \
            --notes "Download the BAT launcher and APK only. Run Taiko-Drum-Menu.bat on Windows, then install the APK on your phone."
